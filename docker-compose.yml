services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: email_agent_postgres
    restart: always
    environment:
      POSTGRES_USER: huepth
      POSTGRES_PASSWORD: huepth123
      POSTGRES_DB: email_agent_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata: